<div class="lang-switch" role="group" [attr.aria-label]="t().common.changeLanguage">
  @for (option of options; track option) {
    <button
      type="button"
      [class.active]="lang() === option"
      [attr.aria-pressed]="lang() === option"
      (click)="setLang(option)"
    >
      {{ option.toUpperCase() }}
    </button>
  }
</div>
