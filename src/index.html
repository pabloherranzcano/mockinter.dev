<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MockinterAngular</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Aplica el tema guardado antes de que se pinte la página, para evitar el parpadeo.
    // Si no hay nada guardado, manda el sistema (lo resuelve el CSS) hasta que Angular arranque.
    try {
      var theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
