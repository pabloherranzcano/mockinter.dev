<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>mockinter.dev · Practica entrevistas técnicas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Preguntas cortas de frontend con explicación, en español e inglés. Gratis y sin registrarte.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Tarjeta al compartir el enlace (LinkedIn, etc.). La imagen necesita dirección absoluta -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="mockinter.dev">
  <meta property="og:url" content="https://www.mockinter.dev/">
  <meta property="og:title" content="mockinter.dev · Practica entrevistas técnicas">
  <meta property="og:description" content="Preguntas cortas de frontend con explicación, en español e inglés. Gratis y sin registrarte.">
  <meta property="og:image" content="https://www.mockinter.dev/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="es_ES">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    // Aplica el tema guardado antes de que se pinte la página, para evitar el parpadeo.
    // Si no hay nada guardado, manda el sistema (lo resuelve el CSS) hasta que Angular arranque.
    try {
      var theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
